<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Películas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">Sistema de Películas</h2>

    <a th:href="@{/nuevo}" class="btn btn-primary mb-3">
        Nueva Película
    </a>

    <table class="table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Director</th>
                <th>Fecha de estreno</th>
                <th>Género ID</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="p : ${peliculas}">
                <td th:text="${p.idpelicula}"></td>
                <td th:text="${p.nombre}"></td>
                <td th:text="${p.director}"></td>
                <td th:text="${p.fechaEstreno}"></td>
                <td th:text="${p.idgenero}"></td>
                <td>
                    <a th:href="@{/editar/{id}(id=${p.idpelicula})}"
                       class="btn btn-warning btn-sm me-1">
                        Editar
                    </a>

                    <form th:action="@{/eliminar/{id}(id=${p.idpelicula})}"
                          method="post" style="display:inline;">
                        <button type="submit"
                                class="btn btn-danger btn-sm"
                                onclick="return confirm('¿Eliminar película?')">
                            Eliminar
                        </button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
