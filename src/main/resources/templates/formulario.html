<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Películas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card border-0">
        <div class="card-header bg-transparent ps-0">
            <h3 th:text="${pelicula.idpelicula == null}
                ? 'Registrar Película' : 'Editar Película'" 
                class="text-dark m-0">
            </h3>
        </div>

        <div class="card-body ps-0">

            <form th:action="@{/guardar}"
                  th:object="${pelicula}"
                  method="post">

                <input type="hidden"
                       th:field="*{idpelicula}">

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text"
                           th:field="*{nombre}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Director</label>
                    <input type="text"
                           th:field="*{director}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Fecha de estreno
                    </label>
                    <input type="date"
                           th:field="*{fechaEstreno}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Género</label>

                    <select th:field="*{idgenero}"
                            class="form-select"
                            required>

                        <option value="">Seleccione género</option>

                        <option th:each="g : ${generos}"
                                th:value="${g.idgenero}"
                                th:text="${g.nombre}">
                        </option>

                    </select>
                </div>

                <div class="mt-4">
                    <button type="submit"
                            class="btn btn-successme-2">
                        Guardar
                    </button>

                    <a th:href="@{/}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
